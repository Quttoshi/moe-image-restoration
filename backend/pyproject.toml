[project]
name = "genai-a1-backend"
version = "0.1.0"
description = "21i2525-A1 FastAPI inference service (ONNX Runtime)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "onnxruntime>=1.20",
    "numpy>=1.26",
    "pillow>=10.4",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false
