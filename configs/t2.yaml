# Task 2 - Corruption classifier + hard-routed specialist autoencoders
experiment: t2_hard_routing

classifier:
  study_name: t2_classifier
  search_space:
    lr: {type: float, low: 1.0e-4, high: 3.0e-3, log: true}
    batch_size: {type: categorical, choices: [32, 64, 128]}
    channels: {type: categorical, choices: ["16-32-64-128", "32-64-128-256", "32-64-128-128", "48-96-192-384"]}
    dropout: {type: float, low: 0.0, high: 0.5}
    weight_decay: {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
  tune: {n_trials: 25, epochs: 6, pruner: {n_startup_trials: 5, n_warmup_steps: 2}}
  train: {epochs: 40, patience: 10}
  defaults: {lr: 1.0e-3, batch_size: 64, channels: "32-64-128-256", dropout: 0.3, weight_decay: 1.0e-4}

specialists:
  # Shared search; objective = mean val score over the three experts.
  # A first study (t2_specialists, 6-epoch trials) suffered short-horizon bias: it selected a
  # 4-channel latent that converges fast but plateaus ~2 dB below the universal DAE. This study
  # uses 15-epoch trials and is warm-started with the Task 1 architecture.
  study_name: t2_specialists_long
  kinds: [salt_pepper, blur, occlusion]
  search_space:
    lr: {type: float, low: 1.0e-4, high: 3.0e-3, log: true}
    batch_size: {type: categorical, choices: [16, 32, 64]}
    latent_res: {type: categorical, choices: [8, 16]}
    latent_ch: {type: categorical, choices: [4, 8, 16, 32]}
    base_ch: {type: categorical, choices: [16, 32, 48]}
    alpha: {type: float, low: 0.5, high: 0.95}
  fixed: {dropout: 0.05, skip_levels: 0, weight_decay: 1.0e-5}
  tune: {n_trials: 3, epochs: 15, pruner: {n_startup_trials: 4, n_warmup_steps: 6}}   # reduced: deadline
  # Warm-start trial: Task 1's selected architecture/optimiser settings.
  enqueue:
    - {lr: 1.78e-3, batch_size: 16, latent_res: 16, latent_ch: 32, base_ch: 32, alpha: 0.636}
  train: {epochs: 20, patience: 6}   # reduced: deadline
  defaults: {lr: 1.0e-3, batch_size: 32, latent_res: 16, latent_ch: 8, base_ch: 32, alpha: 0.8}
