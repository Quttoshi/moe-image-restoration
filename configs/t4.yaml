# Task 4 - Style-conditioned face-to-sketch cGAN (FS2K)
experiment: t4_face2sketch
study_name: t4_cgan

search_space:
  lr_g: {type: float, low: 5.0e-5, high: 5.0e-4, log: true}
  lr_d: {type: float, low: 5.0e-5, high: 5.0e-4, log: true}
  batch_size: {type: categorical, choices: [4, 8, 16]}
  base_ch: {type: categorical, choices: [32, 48, 64]}
  dropout: {type: float, low: 0.0, high: 0.5}
  emb_dim: {type: categorical, choices: [8, 16, 32, 64]}
  lambda_l1: {type: float, low: 10.0, high: 200.0, log: true}

tune:
  n_trials: 4          # reduced: deadline
  epochs: 6            # shortened schedule for trials
  pruner: {n_startup_trials: 4, n_warmup_steps: 3}

train:
  epochs: 40           # reduced from 150: deadline           # constant LR for the first half, linear decay to 0 over the second
  sample_every: 5       # log the fixed validation grid every N epochs
  augment: true         # identical jitter + flip on photo and sketch

betas: [0.5, 0.999]
defaults: {lr_g: 2.0e-4, lr_d: 2.0e-4, batch_size: 8, base_ch: 64, dropout: 0.5, emb_dim: 16, lambda_l1: 100.0}
